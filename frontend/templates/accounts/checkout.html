{% extends "base.html" %}
{% load i18n ndb_tags %}

{% block title %}{% trans "Livraison" %}{% endblock %}

{% block content %}
<section class="container page-wrap form-narrow">
  <h1 class="page-title">{% trans "Finaliser la commande" %}</h1>
  <p class="muted">{% trans "Précisez la ville et l'adresse. Le paiement se fait à la livraison." %}</p>
  <form method="post" class="form-panel">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="ville">{% trans "Ville de livraison" %}</label>
      <select class="form-select" id="ville" name="ville" required>
        <option value="">{% trans "Choisissez une ville" %}</option>
        {% for code in ville_choices %}
          <option value="{{ code }}">{{ code|ville_label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label" for="adresseDetails">{% trans "Adresse / précisions" %}</label>
      <textarea class="form-control" id="adresseDetails" name="adresseDetails" rows="3" required></textarea>
    </div>
    <button class="btn-cta w-100" type="submit">{% trans "Confirmer la commande" %}</button>
  </form>
</section>
{% endblock %}

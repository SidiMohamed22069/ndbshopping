{% load i18n %}
{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
      {% if message.tags == "success" %}
        <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
      {% elif message.tags == "danger" %}
        <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
      {% elif message.tags == "warning" %}
        <i class="bi bi-exclamation-circle-fill" aria-hidden="true"></i>
      {% else %}
        <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
      {% endif %}
      <span>{{ message }}</span>
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="{% trans 'Fermer' %}"></button>
    </div>
  {% endfor %}
{% endif %}

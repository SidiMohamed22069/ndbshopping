{% load i18n %}
{% get_current_language as CURRENT_LANGUAGE %}
<form class="lang-switcher" action="{% url 'set_language' %}" method="post">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <div class="lang-toggle" role="group" aria-label="{% trans 'Langue' %}">
    <button
      type="submit"
      name="language"
      value="fr"
      class="lang-toggle-btn {% if CURRENT_LANGUAGE == 'fr' %}active{% endif %}"
      aria-pressed="{% if CURRENT_LANGUAGE == 'fr' %}true{% else %}false{% endif %}"
    >FR</button>
    <button
      type="submit"
      name="language"
      value="ar"
      class="lang-toggle-btn {% if CURRENT_LANGUAGE == 'ar' %}active{% endif %}"
      aria-pressed="{% if CURRENT_LANGUAGE == 'ar' %}true{% else %}false{% endif %}"
    >ع</button>
  </div>
</form>

spring:
  datasource:
    url: jdbc:h2:mem:ndbshopping;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  jwt:
    secret: test_jwt_secret_key_must_be_32_chars_min
  chinguisoft:
    mock-enabled: true
  upload:
    dir: target/ndbshopping-test-uploads
